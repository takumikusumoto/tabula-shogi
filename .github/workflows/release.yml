name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Target tag name (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: tabula-shogi.exe
            asset_ext: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: tabula-shogi
            asset_ext: tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package Windows asset
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ github.event.inputs.tag_name }}" }
          $pkgName = "tabula-shogi-$tag-windows-x86_64"
          New-Item -ItemType Directory -Path $pkgName
          Copy-Item "target/release/tabula-shogi.exe" -Destination "$pkgName/"
          Copy-Item "README.md" -Destination "$pkgName/"
          Copy-Item "LICENSE" -Destination "$pkgName/"
          Compress-Archive -Path "$pkgName/*" -DestinationPath "$pkgName.zip"
          echo "ASSET_PATH=$pkgName.zip" >> $env:GITHUB_ENV

      - name: Package Linux asset
        if: matrix.os == 'ubuntu-latest'
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.ref_type }}" != "tag" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          PKG_NAME="tabula-shogi-$TAG-linux-x86_64"
          mkdir -p "$PKG_NAME"
          cp target/release/tabula-shogi "$PKG_NAME/"
          cp README.md "$PKG_NAME/"
          cp LICENSE "$PKG_NAME/"
          chmod +x "$PKG_NAME/tabula-shogi"
          tar -czf "$PKG_NAME.tar.gz" -C "$PKG_NAME" .
          echo "ASSET_PATH=$PKG_NAME.tar.gz" >> $GITHUB_ENV

      - name: Generate Release Notes
        if: matrix.os == 'ubuntu-latest'
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.ref_type }}" != "tag" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi

          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
            DIFF_TITLE="What's Changed ($PREV_TAG...$TAG)"
          else
            RANGE="HEAD"
            DIFF_TITLE="Initial Release Features"
          fi

          FEATS=$(git log $RANGE --pretty=format:"- %s (%h)" | grep -E '^- feat:' | sed 's/- feat: /- /' || true)
          PERFS=$(git log $RANGE --pretty=format:"- %s (%h)" | grep -E '^- perf:' | sed 's/- perf: /- /' || true)
          FIXES=$(git log $RANGE --pretty=format:"- %s (%h)" | grep -E '^- fix:' | sed 's/- fix: /- /' || true)
          DOCS=$(git log $RANGE --pretty=format:"- %s (%h)" | grep -E '^- docs:' | sed 's/- docs: /- /' || true)
          CHORES=$(git log $RANGE --pretty=format:"- %s (%h)" | grep -E '^- chore:' | sed 's/- chore: /- /' || true)

          CHANGELOG=""
          if [ -n "$FEATS" ]; then
            CHANGELOG="${CHANGELOG}\n### 🚀 新機能 (Features)\n${FEATS}\n"
          fi
          if [ -n "$PERFS" ]; then
            CHANGELOG="${CHANGELOG}\n### ⚡ パフォーマンス改善 (Performance)\n${PERFS}\n"
          fi
          if [ -n "$FIXES" ]; then
            CHANGELOG="${CHANGELOG}\n### 🐛 バグ修正 (Bug Fixes)\n${FIXES}\n"
          fi
          if [ -n "$DOCS" ]; then
            CHANGELOG="${CHANGELOG}\n### 📚 ドキュメント (Documentation)\n${DOCS}\n"
          fi
          if [ -n "$CHORES" ]; then
            CHANGELOG="${CHANGELOG}\n### 🔧 開発基盤・その他 (Chores)\n${CHORES}\n"
          fi

          cat <<EOF > release_notes.md
## 概要

TabulaShogi $TAG のリリースです。
外部の学習済みモデル・評価重み・定跡バイナリ・他将棋OSSの探索コードに一切依存せず、完全スクラッチで実装されたUSI対応将棋エンジンです。

---

## 主な変更点 ($DIFF_TITLE)
$(echo -e "$CHANGELOG")

---

## 配布物（Assets）の構成

本リリースでは、Rust開発環境不要で将棋GUI（ShogiGUI、将棋所など）から直接ご利用いただける **Windows用** および **Linux（Ubuntu）用** のコンパイル済みパッケージを配布しています。

### Windows向け (\`tabula-shogi-$TAG-windows-x86_64.zip\`)
\`\`\`text
tabula-shogi-$TAG-windows-x86_64.zip
├── tabula-shogi.exe   # USI対応将棋思考エンジンの実行バイナリ（最適化ビルド済み）
├── README.md          # 概要・USI GUIへのエンジン登録方法・使い方
└── LICENSE            # MITライセンス表示
\`\`\`
- **使い方**: ZIPを解凍後、ShogiGUI等の「エンジン設定」から \`tabula-shogi.exe\` を登録して対局・検討を開始できます。

### Linux（Ubuntu）向け (\`tabula-shogi-$TAG-linux-x86_64.tar.gz\`)
\`\`\`text
tabula-shogi-$TAG-linux-x86_64.tar.gz
├── tabula-shogi       # Linux向け実行バイナリ（実行権限付き）
├── README.md
└── LICENSE
\`\`\`
- **使い方**:
  \`\`\`bash
  tar -xzf tabula-shogi-$TAG-linux-x86_64.tar.gz
  ./tabula-shogi
  \`\`\`
  ターミナルでのUSI直接対話、またはLinux対応将棋GUI（将棋所 Linux版等）に登録して使用できます。
EOF
          echo "BODY_ARG=release_notes.md" >> $GITHUB_ENV

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag_name }}
          files: ${{ env.ASSET_PATH }}
          body_path: ${{ env.BODY_ARG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
