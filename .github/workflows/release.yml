name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Target tag name (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package (${{ matrix.os }})
    if: github.repository == 'takumikusumoto/tabula-shogi'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: tabula-shogi.exe
            asset_ext: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: tabula-shogi
            asset_ext: tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read Rust toolchain from rust-toolchain.toml
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)
          if [ -z "$channel" ]; then
            echo "Failed to read channel from rust-toolchain.toml" >&2
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package Windows asset
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          $tag = if ($env:REF_TYPE -eq "tag") { $env:REF_NAME } else { $env:INPUT_TAG }
          $pkgName = "tabula-shogi-$tag-windows-x86_64"
          New-Item -ItemType Directory -Path $pkgName
          Copy-Item "target/release/tabula-shogi.exe" -Destination "$pkgName/"
          Copy-Item "README.md" -Destination "$pkgName/"
          Copy-Item "LICENSE" -Destination "$pkgName/"
          Compress-Archive -Path "$pkgName/*" -DestinationPath "$pkgName.zip"
          echo "ASSET_PATH=$pkgName.zip" >> $env:GITHUB_ENV

      - name: Package Linux asset
        if: matrix.os == 'ubuntu-latest'
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          TAG="$REF_NAME"
          if [ "$REF_TYPE" != "tag" ]; then
            TAG="$INPUT_TAG"
          fi
          PKG_NAME="tabula-shogi-$TAG-linux-x86_64"
          mkdir -p "$PKG_NAME"
          cp target/release/tabula-shogi "$PKG_NAME/"
          cp README.md "$PKG_NAME/"
          cp LICENSE "$PKG_NAME/"
          chmod +x "$PKG_NAME/tabula-shogi"
          tar -czf "$PKG_NAME.tar.gz" -C "$PKG_NAME" .
          echo "ASSET_PATH=$PKG_NAME.tar.gz" >> "$GITHUB_ENV"

      - name: Upload packaged asset
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-${{ matrix.os }}
          path: ${{ env.ASSET_PATH }}

  publish-release:
    name: Publish GitHub Release
    if: github.repository == 'takumikusumoto/tabula-shogi'
    needs: build-release
    runs-on: ubuntu-latest

    steps:
      - name: Download packaged assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-asset-*
          merge-multiple: true
          path: release-assets

      - name: Generate Release Notes
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          TAG="$REF_NAME"
          if [ "$REF_TYPE" != "tag" ]; then
            TAG="$INPUT_TAG"
          fi

          cat <<EOF > release_notes.md
          ## 概要

          TabulaShogi $TAG のリリースです。
          外部の学習済みモデル・評価重み・定跡バイナリ・他将棋OSSの探索コードに一切依存せず、完全スクラッチで実装されたUSI対応将棋エンジンです。

          ---

          ## 配布物（Assets）の構成

          本リリースでは、Rust開発環境不要で将棋GUI（ShogiHome、ShogiGUI、将棋所など）から直接ご利用いただける **Windows用** および **Linux（Ubuntu）用** のコンパイル済みパッケージを配布しています。

          ### Windows向け (\`tabula-shogi-$TAG-windows-x86_64.zip\`)
          \`\`\`text
          tabula-shogi-$TAG-windows-x86_64.zip
          ├── tabula-shogi.exe   # USI対応将棋思考エンジンの実行バイナリ（最適化ビルド済み）
          ├── README.md          # 概要・USI GUIへのエンジン登録方法・使い方
          └── LICENSE            # MITライセンス表示
          \`\`\`
          - **使い方**: ZIPを解凍後、ShogiHome / ShogiGUI 等の「エンジン設定」から \`tabula-shogi.exe\` を登録して対局・検討を開始できます。

          ### Linux（Ubuntu）向け (\`tabula-shogi-$TAG-linux-x86_64.tar.gz\`)
          \`\`\`text
          tabula-shogi-$TAG-linux-x86_64.tar.gz
          ├── tabula-shogi       # Linux向け実行バイナリ（実行権限付き）
          ├── README.md
          └── LICENSE
          \`\`\`
          - **使い方**:
            \`\`\`bash
            tar -xzf tabula-shogi-$TAG-linux-x86_64.tar.gz
            ./tabula-shogi
            \`\`\`
            ターミナルでのUSI直接対話、またはLinux対応将棋GUI（ShogiHome、将棋所 Linux版等）に登録して使用できます。

          ---

          ## 📖 使い方とUSIオプション

          ビルド手順・CLIサブコマンド・USIオプションの詳細については、同梱の \`README.md\` をご確認ください。
          EOF

      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag_name }}
          files: release-assets/*
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
