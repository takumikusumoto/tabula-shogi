[package]
name = "tabula-shogi"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["Takumi Kusumoto"]
description = "A pure scratch-built USI Shogi Engine using zero external weights or OSS search, learning purely via self-play (Tabula Rasa)"
license = "MIT"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
